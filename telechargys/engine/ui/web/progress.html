<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telechargys</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
<style>
body{overflow:auto;background:var(--panel);user-select:none}
.pw{padding:12px 16px 12px;display:flex;flex-direction:column;gap:8px;min-height:100vh}
.pw .cap{margin:4px 0 3px}
.pw h1{margin:0;font-size:14px;display:flex;align-items:center;gap:10px}
.pw h1 .ficon{width:34px;height:34px;font-size:10px}
.pw h1 span:not(.ficon):not(.okicon){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pw .kv{grid-template-columns:110px 1fr}
.pw .bar{height:14px;border-radius:7px}
.pw .big{display:flex;align-items:center;gap:10px}
.pw .big .bar{flex:1}
.pw .big b{font-size:15px;min-width:52px;text-align:right}
.pw .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto}
.pw .lft{margin-right:auto}
.pw canvas{height:22px}
.okicon{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.okicon svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.path{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;user-select:text}
</style>
</head>
<body>
<div class="pw" id="pw"></div>
<script src="progress.js"></script>
</body>
</html>
