[project]
name = "doublys"
version = "1.2.0"
description = "Doublys (Echo Matras) : doublage automatique de vidéos de l'anglais vers le français, sur votre ordinateur."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: tests de l'interface graphique (Qt hors écran)",
    "ffmpeg: tests nécessitant FFmpeg",
]

[tool.ruff]
line-length = 120
target-version = "py310"
