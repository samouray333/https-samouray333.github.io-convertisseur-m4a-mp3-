name: AudioLivre Studio — build Windows

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "audiolivre-studio/**"
      - ".github/workflows/audiolivre-windows.yml"
  pull_request:
    paths:
      - "audiolivre-studio/**"
      - ".github/workflows/audiolivre-windows.yml"
  workflow_dispatch:
    inputs:
      engine_tests:
        description: "Tester l'installation réelle des moteurs IA (Kokoro, XTTS, Chatterbox)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: audiolivre-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: audiolivre-studio

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audiolivre-studio/requirements*.txt
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Dépendances Python
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --select F,E9 --line-length 120 audiolivre main.py scripts tests
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-windows:
    name: Installateur Windows
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audiolivre-studio/requirements*.txt

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path audiolivre/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $v"

      - name: Dépendances Python
        run: pip install -r requirements-dev.txt

      - name: Tests unitaires (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not gui"

      - name: Outils (FFmpeg, uv)
        shell: pwsh
        run: |
          $tools = "packaging/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip",
            "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build-shared.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Téléchargement de $u"
              Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -UseBasicParsing
              Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x -Force
              $bin = Get-ChildItem -Path ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              Copy-Item "$($bin.DirectoryName)\*.exe" $tools
              Copy-Item "$($bin.DirectoryName)\*.dll" $tools -ErrorAction SilentlyContinue
              Remove-Item "$tools\ffplay.exe" -ErrorAction SilentlyContinue
              $ok = $true
              break
            } catch { Write-Warning "Échec : $_" }
          }
          if (-not $ok) { throw "FFmpeg indisponible" }
          python -c "import uv, shutil; shutil.copy(uv.find_uv_bin(), r'packaging/tools/uv.exe')"
          Get-ChildItem $tools | Format-Table Name, Length
          & "$tools/ffmpeg.exe" -hide_banner -encoders | Select-String "libmp3lame|aac |libopus|flac"

      - name: Icône et images de l'installateur
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_assets.py

      - name: PyInstaller
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: pyinstaller --noconfirm --clean packaging/audiolivre.spec

      - name: Autotest de l'exécutable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist/AudioLivreStudio/AudioLivreStudio.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report -Raw
          $r = Get-Content $report -Raw | ConvertFrom-Json
          foreach ($c in $r.results) { Write-Host ("[{0}] {1} : {2}" -f ($(if ($c.ok) {"OK"} else {"ÉCHEC"})), $c.check, $c.detail) }
          if ($p.ExitCode -ne 0 -or -not $r.ok) { throw "Autotest en échec (code $($p.ExitCode))" }

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $root = (Resolve-Path .).Path
          Write-Host "Racine : $root"
          Get-ChildItem packaging\assets, audiolivre\resources | Format-Table Name, Length
          Test-Path dist\AudioLivreStudio\AudioLivreStudio.exe
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DAppRoot=$root" "$root\packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Version portable (zip)
        shell: pwsh
        run: |
          New-Item -ItemType File -Force -Path dist/AudioLivreStudio/portable.txt -Value "Supprimez ce fichier pour stocker les données dans le profil utilisateur." | Out-Null
          Compress-Archive -Path dist/AudioLivreStudio -DestinationPath "dist/AudioLivreStudio-Portable-${{ steps.ver.outputs.version }}.zip" -CompressionLevel Optimal

      - name: Installateur (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: AudioLivreStudio-Setup-${{ steps.ver.outputs.version }}
          path: audiolivre-studio/dist/AudioLivreStudio-Setup-*.exe
          if-no-files-found: error

      - name: Version portable (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: AudioLivreStudio-Portable-${{ steps.ver.outputs.version }}
          path: audiolivre-studio/dist/AudioLivreStudio-Portable-*.zip

      - name: Publication (tag v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: AudioLivre Studio ${{ steps.ver.outputs.version }}
          files: |
            audiolivre-studio/dist/AudioLivreStudio-Setup-*.exe
            audiolivre-studio/dist/AudioLivreStudio-Portable-*.zip
          body: |
            **AudioLivre Studio ${{ steps.ver.outputs.version }}** — transformez vos documents Word et PDF en livres audio professionnels, avec clonage de voix.

            Téléchargez `AudioLivreStudio-Setup-${{ steps.ver.outputs.version }}.exe`, lancez-le et suivez l'assistant.
            Windows peut afficher « Windows a protégé votre ordinateur » (application non signée) : cliquez sur « Informations complémentaires » puis « Exécuter quand même ».

  engines:
    name: Test moteurs IA (optionnel)
    runs-on: windows-latest
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.engine_tests || contains(github.event.head_commit.message, '[engines]')
    strategy:
      fail-fast: false
      matrix:
        engine: [kokoro, xtts, chatterbox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audiolivre-studio/requirements*.txt
      - name: Dépendances
        run: |
          pip install -r requirements-dev.txt
          choco install ffmpeg -y --no-progress
      - name: Installation et synthèse réelles
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/engine_smoke.py --engine ${{ matrix.engine }} --device cpu
