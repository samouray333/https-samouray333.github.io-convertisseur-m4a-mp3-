name: Transferys - build Windows

on:
  push:
    branches: ["claude/transferys**"]
    paths:
      - "transferys-app/**"
      - ".github/workflows/transferys-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transferys-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: transferys-app

jobs:
  windows:
    name: Tests + installateur Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)\+'
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $v"

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos

      - name: Tests du moteur sur Windows (appairage, 500 fichiers, coupure, reprise, doublons…)
        run: flutter test test/engine_test.dart test/remote_test.dart -r expanded

      # Le chemin de travail GitHub est très long (nom du dépôt répété) :
      # Visual Studio dépasse la limite de 260 caractères. On compile depuis C:\tx.
      - name: Compilation Windows (release, chemin court)
        shell: pwsh
        run: |
          if (Test-Path C:\tx) { Remove-Item -Recurse -Force C:\tx }
          New-Item -ItemType Directory C:\tx | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('build', '.dart_tool') } | Copy-Item -Destination C:\tx -Recurse -Force
          Set-Location C:\tx
          flutter pub get
          flutter build windows --release
          New-Item -ItemType Directory -Force -Path build | Out-Null

      - name: Installateur NSIS + version portable
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = "${env:ProgramFiles(x86)}\NSIS"
            if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress | Out-Null }
            $env:Path += ";$nsis"
          }
          $v = "${{ steps.ver.outputs.version }}"
          $rel = "C:\tx\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dist = (Resolve-Path dist).Path
          makensis /V2 /DVERSION=$v "/DSRC=$rel" "/DOUTFILE=$dist\Transferys-Setup-$v.exe" C:\tx\windows\installer\transferys.nsi
          $p = "$dist\Transferys-Portable-$v"
          Copy-Item -Recurse $rel $p
          Set-Content -Path "$p\LISEZ-MOI.txt" -Encoding UTF8 -Value @"
          Transferys $v - version portable (aucune installation)
          Double-cliquez sur Transferys.exe.
          Au premier lancement, Windows demande d'autoriser Transferys dans le pare-feu :
          cochez « Réseaux privés » puis Autoriser (sinon le téléphone ne pourra pas joindre le PC).
          Pour le clic droit « Envoyer avec Transferys » et l'ajout automatique au pare-feu,
          préférez l'installateur Transferys-Setup-$v.exe.
          "@
          Compress-Archive -Path "$p\*" -DestinationPath "$dist\Transferys-Portable-$v.zip"
          Remove-Item -Recurse $p
          Get-ChildItem $dist | Format-Table Name, Length

      - name: Lancement de contrôle (l'exe démarre et reste ouvert)
        shell: pwsh
        run: |
          $exe = "C:\tx\build\windows\x64\runner\Release\Transferys.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Transferys.exe s'est fermé (code $($p.ExitCode))" }
          Write-Host "Transferys.exe tourne toujours après 15 s (PID $($p.Id))"
          $c = Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction SilentlyContinue
          $c | Format-Table LocalAddress, LocalPort
          Stop-Process -Id $p.Id -Force

      - name: Test de l'installateur (installation silencieuse, contrôles, désinstallation)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $setup = (Resolve-Path "dist\Transferys-Setup-$v.exe").Path
          Start-Process $setup -ArgumentList '/S' -Wait
          $dir = "$env:ProgramFiles\Transferys"
          if (-not (Test-Path "$dir\Transferys.exe")) { throw "Transferys.exe absent après installation" }
          $u = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Transferys'
          Write-Host "Applications et fonctionnalités : $($u.DisplayName) $($u.DisplayVersion) ($($u.Publisher))"
          $fw = netsh advfirewall firewall show rule name="Transferys"
          if ($LASTEXITCODE -ne 0) { throw "Règle de pare-feu absente" }
          $fw | Select-String "Profil|Profiles|Action|Programme|Program"
          if (-not (Test-Path 'Registry::HKEY_CURRENT_USER\Software\Classes\*\shell\Transferys\command')) { throw "Menu clic droit absent" }
          Write-Host "Clic droit : $((Get-ItemProperty 'Registry::HKEY_CURRENT_USER\Software\Classes\*\shell\Transferys\command').'(default)')"
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\SendTo\Transferys.lnk")) { throw "Raccourci Envoyer vers absent" }
          Write-Host "Installation OK : exe, désinstallation, pare-feu, clic droit, Envoyer vers"
          Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 8
          if (Test-Path "$dir\Transferys.exe") { throw "Désinstallation incomplète" }
          if (Test-Path 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Transferys') { throw "Entrée de désinstallation restante" }
          Write-Host "Désinstallation propre OK"

      - uses: actions/upload-artifact@v4
        with:
          name: Transferys-Windows-${{ steps.ver.outputs.version }}
          path: transferys-app/dist/*

      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: transferys-v${{ steps.ver.outputs.version }}-r${{ github.run_number }}
          name: Transferys ${{ steps.ver.outputs.version }} (Windows)
          target_commitish: ${{ github.sha }}
          files: transferys-app/dist/*
          body: |
            Transferys ${{ steps.ver.outputs.version }} pour Windows 10 / 11.
            - Transferys-Setup : installateur (pare-feu, clic droit, Envoyer vers, raccourcis)
            - Transferys-Portable : version sans installation
