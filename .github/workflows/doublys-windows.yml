name: Doublys — build Windows

on:
  push:
    branches: [main, "claude/**"]
    tags: ["doublys-v*"]
    paths:
      - "doublys-app/**"
      - ".github/workflows/doublys-windows.yml"
  pull_request:
    paths:
      - "doublys-app/**"
      - ".github/workflows/doublys-windows.yml"
  workflow_dispatch:
    inputs:
      engine_tests:
        description: "Tester les vrais moteurs IA sur processeur (analyse, Whisper, Kokoro, Chatterbox, chaîne complète)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: doublys-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: doublys-app

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doublys-app/requirements*.txt
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Dépendances Python
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --select F,E9 --line-length 120 doublys main.py scripts tests
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Autotest (sources)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python main.py --selftest "$RUNNER_TEMP/selftest.json" || (cat "$RUNNER_TEMP/selftest.json"; exit 1)
          python -c "import json,sys; r=json.load(open(sys.argv[1])); [print('OK ' if c['ok'] else 'ÉCHEC', c['check'], ':', c['detail']) for c in r['results']]" "$RUNNER_TEMP/selftest.json"

  build-windows:
    name: Installateur Windows
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doublys-app/requirements*.txt

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path doublys/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".Replace("doublys-v", "") }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $v"

      - name: Dépendances Python
        run: pip install -r requirements-dev.txt

      - name: Tests unitaires (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not gui"

      - name: Outils (FFmpeg LGPL, uv)
        shell: pwsh
        run: |
          $tools = "packaging/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          # Build LGPL de BtbN uniquement (pas de composant GPL : distribution possible)
          $u = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip"
          Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x -Force
          $bin = Get-ChildItem -Path ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item "$($bin.DirectoryName)\*.exe" $tools
          Copy-Item "$($bin.DirectoryName)\*.dll" $tools -ErrorAction SilentlyContinue
          Remove-Item "$tools\ffplay.exe" -ErrorAction SilentlyContinue
          python -c "import uv, shutil; shutil.copy(uv.find_uv_bin(), r'packaging/tools/uv.exe')"
          Get-ChildItem $tools | Format-Table Name, Length
          & "$tools/ffmpeg.exe" -hide_banner -encoders | Select-String "aac |libmp3lame|mov_text|libopenh264|h264_mf|libx264"

      - name: Icône et images de l'installateur
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_assets.py

      - name: PyInstaller
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: pyinstaller --noconfirm --clean packaging/doublys.spec

      - name: Autotest de l'exécutable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist/Doublys/Doublys.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report -Raw
          $r = Get-Content $report -Raw | ConvertFrom-Json
          foreach ($c in $r.results) { Write-Host ("[{0}] {1} : {2}" -f ($(if ($c.ok) {"OK"} else {"ÉCHEC"})), $c.check, $c.detail) }
          if ($p.ExitCode -ne 0 -or -not $r.ok) { throw "Autotest en échec (code $($p.ExitCode))" }

      - name: Installateur NSIS
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; }
          $root = (Resolve-Path .).Path
          & $nsis "/DAPP_VERSION=${{ steps.ver.outputs.version }}" "/DAPP_ROOT=$root" "$root\packaging\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis a échoué" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Test de l'installateur (installation silencieuse, lancement, désinstallation)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = Get-ChildItem dist\Doublys-Setup-*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "DoublysInstall"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation silencieuse en échec ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\Doublys.exe")) { throw "Doublys.exe absent après installation" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Doublys"
          if (-not (Test-Path $key)) { throw "Entrée « Applications et fonctionnalités » absente" }
          (Get-ItemProperty $key) | Format-List DisplayName, DisplayVersion, Publisher, EstimatedSize
          $v = Start-Process -FilePath "$dir\Doublys.exe" -ArgumentList "--version" -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "Doublys installé ne démarre pas" }
          $u = Start-Process -FilePath "$dir\Desinstaller.exe" -ArgumentList "/S", "_?=$dir" -Wait -PassThru
          if (Test-Path "$dir\Doublys.exe") { throw "Désinstallation incomplète" }
          if (Test-Path $key) { throw "Entrée de désinstallation restante" }
          Write-Host "Installation et désinstallation vérifiées ✔"

      - name: Version portable (zip)
        shell: pwsh
        run: |
          New-Item -ItemType File -Force -Path dist/Doublys/portable.txt -Value "Supprimez ce fichier pour stocker les données dans le profil utilisateur." | Out-Null
          Compress-Archive -Path dist/Doublys -DestinationPath "dist/Doublys-Portable-${{ steps.ver.outputs.version }}.zip" -CompressionLevel Optimal

      - name: Code source (zip)
        shell: pwsh
        working-directory: .
        run: |
          git archive --format=zip --prefix=doublys-app/ -o "doublys-app/dist/Doublys-Source-${{ steps.ver.outputs.version }}.zip" HEAD:doublys-app

      - name: Installateur (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Doublys-Setup-${{ steps.ver.outputs.version }}
          path: doublys-app/dist/Doublys-Setup-*.exe
          if-no-files-found: error

      - name: Version portable (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Doublys-Portable-${{ steps.ver.outputs.version }}
          path: doublys-app/dist/Doublys-Portable-*.zip

      - name: Code source (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Doublys-Source-${{ steps.ver.outputs.version }}
          path: doublys-app/dist/Doublys-Source-*.zip

      - name: Publication (tag doublys-v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Doublys ${{ steps.ver.outputs.version }}
          files: |
            doublys-app/dist/Doublys-Setup-*.exe
            doublys-app/dist/Doublys-Portable-*.zip
            doublys-app/dist/Doublys-Source-*.zip
          body: |
            **Doublys ${{ steps.ver.outputs.version }}** (Echo Matras) : la version française de vos vidéos anglaises, créée sur votre ordinateur.

            ### Installation
            - **Installateur** : `Doublys-Setup-${{ steps.ver.outputs.version }}.exe` (aucun droit administrateur nécessaire).
            - **Version portable** : décompressez `Doublys-Portable-${{ steps.ver.outputs.version }}.zip` et lancez `Doublys.exe`.
            - Windows peut afficher « Windows a protégé votre ordinateur » (application non signée) : « Informations complémentaires » puis « Exécuter quand même ».
            - Au premier lancement, cliquez sur « Installer tout ce qu'il faut » (environ 6 Go, une seule fois).

  engines:
    name: Test réel des moteurs IA (optionnel, CPU)
    runs-on: windows-latest
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.engine_tests || contains(github.event.head_commit.message, '[engines]')
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test: [analysis, whisper, kokoro, chatterbox, full, full-ja]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doublys-app/requirements*.txt
      - name: Dépendances
        run: |
          pip install -r requirements-dev.txt
          choco install ffmpeg -y --no-progress
      - name: Installation et essai réels
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          if ("${{ matrix.test }}" -eq "full") { python scripts/engine_smoke.py --full --device cpu }
          elseif ("${{ matrix.test }}" -eq "full-ja") { python scripts/engine_smoke.py --full --lang ja --device cpu }
          else { python scripts/engine_smoke.py --engine ${{ matrix.test }} --device cpu }
          if ($LASTEXITCODE -ne 0) { throw "Échec du test ${{ matrix.test }}" }
