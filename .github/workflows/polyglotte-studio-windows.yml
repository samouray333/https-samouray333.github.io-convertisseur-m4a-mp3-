name: Polyglotte Studio — build Windows

on:
  push:
    branches: [main, "claude/**"]
    tags: ["polyglotte-v*"]
    paths:
      - "polyglotte-studio/**"
      - ".github/workflows/polyglotte-studio-windows.yml"
  pull_request:
    paths:
      - "polyglotte-studio/**"
      - ".github/workflows/polyglotte-studio-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polyglotte-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: polyglotte-studio

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: polyglotte-studio/requirements*.txt
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Dépendances Python
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check --select F,E9 --line-length 120 polyglottestudio main.py scripts tests
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build-windows:
    name: Installateur Windows
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: polyglotte-studio/requirements*.txt

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path polyglottestudio/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".Substring(12) }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $v"

      - name: Dépendances Python
        run: pip install -r requirements-dev.txt

      - name: Tests unitaires (Windows)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not gui"

      - name: Outils (FFmpeg, uv)
        shell: pwsh
        run: |
          $tools = "packaging/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip",
            "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build-shared.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Téléchargement de $u"
              Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip -UseBasicParsing
              Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x -Force
              $bin = Get-ChildItem -Path ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              Copy-Item "$($bin.DirectoryName)\*.exe" $tools
              Copy-Item "$($bin.DirectoryName)\*.dll" $tools -ErrorAction SilentlyContinue
              Remove-Item "$tools\ffplay.exe" -ErrorAction SilentlyContinue
              $ok = $true
              break
            } catch { Write-Warning "Échec : $_" }
          }
          if (-not $ok) { throw "FFmpeg indisponible" }
          python -c "import uv, shutil; shutil.copy(uv.find_uv_bin(), r'packaging/tools/uv.exe')"
          Get-ChildItem $tools | Format-Table Name, Length
          & "$tools/ffmpeg.exe" -hide_banner -encoders | Select-String "libmp3lame|aac |libopus|flac"

      - name: Icône et images de l'installateur
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/make_assets.py

      - name: PyInstaller
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: pyinstaller --noconfirm --clean packaging/polyglottestudio.spec

      - name: Autotest de l'exécutable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist/PolyglotteStudio/PolyglotteStudio.exe" -ArgumentList "--selftest", "`"$report`"" -Wait -PassThru
          Get-Content $report -Raw
          $r = Get-Content $report -Raw | ConvertFrom-Json
          foreach ($c in $r.results) { Write-Host ("[{0}] {1} : {2}" -f ($(if ($c.ok) {"OK"} else {"ÉCHEC"})), $c.check, $c.detail) }
          if ($p.ExitCode -ne 0 -or -not $r.ok) { throw "Autotest en échec (code $($p.ExitCode))" }

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $root = (Resolve-Path .).Path
          Write-Host "Racine : $root"
          Get-ChildItem packaging\assets, polyglottestudio\resources | Format-Table Name, Length
          Test-Path dist\PolyglotteStudio\PolyglotteStudio.exe
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DAppRoot=$root" "$root\packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué" }
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Version portable (zip)
        shell: pwsh
        run: |
          New-Item -ItemType File -Force -Path dist/PolyglotteStudio/portable.txt -Value "Supprimez ce fichier pour stocker les données dans le profil utilisateur." | Out-Null
          Compress-Archive -Path dist/PolyglotteStudio -DestinationPath "dist/PolyglotteStudio-Portable-${{ steps.ver.outputs.version }}.zip" -CompressionLevel Optimal

      - name: Installateur (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: PolyglotteStudio-Setup-${{ steps.ver.outputs.version }}
          path: polyglotte-studio/dist/PolyglotteStudio-Setup-*.exe
          if-no-files-found: error

      - name: Version portable (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: PolyglotteStudio-Portable-${{ steps.ver.outputs.version }}
          path: polyglotte-studio/dist/PolyglotteStudio-Portable-*.zip

      - name: Publication (tag polyglotte-v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Polyglotte Studio ${{ steps.ver.outputs.version }}
          files: |
            polyglotte-studio/dist/PolyglotteStudio-Setup-*.exe
            polyglotte-studio/dist/PolyglotteStudio-Portable-*.zip
          body: |
            **Polyglotte Studio ${{ steps.ver.outputs.version }}** — apprenez les langues à l'écoute, avec des voix natives.

            ### Installation
            - **Installateur** : téléchargez `PolyglotteStudio-Setup-${{ steps.ver.outputs.version }}.exe`, lancez-le et suivez l'assistant (aucun droit administrateur nécessaire).
            - **Version portable** : décompressez `PolyglotteStudio-Portable-${{ steps.ver.outputs.version }}.zip` et lancez `PolyglotteStudio.exe`.
            - Windows peut afficher « Windows a protégé votre ordinateur » (application non signée) : cliquez sur « Informations complémentaires » puis « Exécuter quand même ».
            - Déjà équipé d'AudioLivre Studio, PodCast Studio ou Leçon Studio ? Les moteurs IA, leurs modèles, vos voix et votre clé DeepSeek sont repris automatiquement : rien à réinstaller.

            ### Points forts
            - Environ 80 langues et de nombreux accents régionaux, avec plus de 300 voix natives Microsoft gratuites (femmes et hommes) ; Kokoro et XTTS en secours hors ligne.
            - Balises de langue dans le script : `[es]¿Qué tal?[/es]`, `[ja] …`, `[en-GB]` ; une voix native différente pour chaque personnage des dialogues.
            - Leçons écrites par DeepSeek selon la langue, le niveau (A1 à C2) et le thème : vocabulaire, phrases utiles, dialogues, petites histoires, grammaire, translittérations, questions et quiz.
            - Exercices audio : écoutez puis répétez, lecture lente puis normale, traduction différée, dictée, compréhension.
            - Révisions espacées (J+1, J+3, J+7, J+14, J+30) avec séances audio et calendrier ; glossaire et favoris.
            - Export : MP3 par leçon et par module, séances de révision, support écrit HTML, flashcards imprimables, Anki avec l'audio de chaque mot.
            - Tout est gratuit et fonctionne sans carte graphique NVIDIA ; l'assistant DeepSeek (facultatif) coûte quelques centimes.
